name: GBM CDKN2A deletion bracket query
description: |-
  ### Focal high-level deletion involving the _CDKN2A_ locus in Glioblastoma

  #### Solution using `start` and `end` ranges and an NCIT disease code

  To match deletion variants overlapping the CDKN2A gene's coding region (CDR) with
  at least a single base, but limited to "focal" hits (here i.e. <= ~2Mbp in size)
  a bracket query is constructed where the `start` range goes  from ~1Mb 5\'
  of the CDKN2A CDR until the end of the CDR and the `end` range goes from the
  start of the CDR to ~1Mb 3\' of the gene. 

  The query uses `"variantType": "EFO:0020073"` for `high-level copy number loss`
  as specified in the [VRS definitions](https://vrs.ga4gh.org/en/latest/terms_and_model.html#systemic-variation).
  With hierarchical expansion of this term explicit complete genomic deletions
  (`EFO:0030069`) should be retrieved too.

  #### Requirements and considerations

  * understanding/mapping of `"variantType": "EFO:0020073"`
  * understanding/mapping of "NCIT:C3058" (Glioblastoma)
  * support of bracket requests (a Beacon v2 requirement)
  * aggregation over entry types

# ============================================================================ #

entryTypeAggregation: true
beaconVersions:
  - v2
POSTrequest:
  filters:
    - NCIT:C3058
  requestParameters:
    assemblyId: GRCh38
    referenceName: chr9
    start:
      - 21000001
      - 21975098
    end:
      - 21967753
      - 23000000
    variantType: EFO:0020073
GETrequest: ?filters=NCIT:C3058&assemblyId=GRCh38&referenceName=chr9&start=21000001,21975098&end=21967753,23000000&variantType=EFO:0020073

